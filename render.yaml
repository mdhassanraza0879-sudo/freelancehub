services:
  # ─── 1. Backend Web Service (Node.js + Express API) ─────────────────────────
  - type: web
    name: freelancehub-api
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        value: mongodb+srv://mdhassanraza0879_db_user:-wJUnV5L-yTXq8F@cluster0.woqaata.mongodb.net/freelancehub?retryWrites=true&w=majority&appName=Cluster0
      - key: JWT_SECRET
        value: freelancehub_super_secret_key_change_in_production
      - key: RAZORPAY_KEY_ID
        value: rzp_test_ENTER_YOUR_KEY_HERE
      - key: RAZORPAY_KEY_SECRET
        value: ENTER_YOUR_SECRET_HERE

  # ─── 2. Frontend Static Site (React + Vite) ─────────────────────────────────
  - type: static
    name: freelancehub-web
    env: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: freelancehub-api
          property: host
